<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Scanner - Nhập Số Lượng</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; text-align: center; background: #f8fafc; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        
        /* Box nhập số lượng, mặc định ẩn đi */
        #input-form { display: none; background: #eff6ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #bfdbfe; }
        .sp-info { font-size: 18px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
        .qty-info { font-size: 14px; color: #475569; margin-bottom: 15px; }
        
        input[type="number"] { width: 80%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 48%; }
        .btn-submit { background: #2563eb; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }

        #status { padding: 15px; border-radius: 8px; font-weight: bold; font-size: 15px; }
        .success { background-color: #dcfce7; color: #166534; }
        .error { background-color: #fee2e2; color: #991b1b; }
        .loading { background-color: #f1f5f9; color: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nhập Kho Hàng</h2>
        
        <div id="scanner-section">
            <div id="reader"></div>
        </div>

        <div id="input-form">
            <div class="sp-info" id="sp-name">Tên Sản Phẩm</div>
            <div class="qty-info" id="sp-qty">Tồn hiện tại: 0</div>
            
            <input type="number" id="input-amount" placeholder="Nhập số lượng..." value="1" min="1">
            
            <div style="display: flex; justify-content: space-between;">
                <button class="btn-cancel" onclick="cancelInput()">Hủy bỏ</button>
                <button class="btn-submit" onclick="submitUpdate()">Xác nhận</button>
            </div>
        </div>

        <div id="status" class="loading">Đang khởi động camera...</div>
    </div>

    <script>
        // THAY LINK APP SCRIPT CỦA BẠN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbxZi7yFbogjlAfeRKAUkVXKnkYYli0MmByKCpVSNwuK-9_CWLHBijH8fF5trnmIX1yW0A/exec"; 
        
        const statusDiv = document.getElementById('status');
        const inputForm = document.getElementById('input-form');
        const scannerSection = document.getElementById('scanner-section');
        
        const html5QrCode = new Html5Qrcode("reader");
        let isProcessing = false;
        let currentScannedCode = "";

        // Khởi động Camera
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } }, 
            onScanSuccess
        ).then(() => {
            statusDiv.innerText = "Sẵn sàng: Đưa mã vào khung hình";
        }).catch((err) => {
            statusDiv.innerText = "Lỗi Camera. Vui lòng cấp quyền!";
            statusDiv.className = "error";
        });

        // 1. KHI QUÉT THÀNH CÔNG
        function onScanSuccess(decodedText) {
            if (isProcessing) return; // Chặn quét liên tục
            isProcessing = true;
            currentScannedCode = decodedText;
            
            statusDiv.innerText = `Đang tra cứu mã: ${decodedText}...`;
            statusDiv.className = "loading";

            // Gọi API lấy thông tin (action: 'get_info')
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_info', maSP: decodedText })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    // Nếu có mã, ẩn camera, hiện form nhập
                    scannerSection.style.display = "none";
                    inputForm.style.display = "block";
                    
                    document.getElementById('sp-name').innerText = data.tenSP;
                    document.getElementById('sp-qty').innerText = `Tồn hiện tại: ${data.currentQty}`;
                    document.getElementById('input-amount').value = 1; // Reset về 1
                    
                    statusDiv.innerText = "Vui lòng nhập số lượng.";
                    statusDiv.className = "success";
                } else {
                    // Mã không tồn tại
                    statusDiv.innerText = `Lỗi: ${data.message}`;
                    statusDiv.className = "error";
                    setTimeout(() => { resetScanner(); }, 2000);
                }
            })
            .catch(err => {
                statusDiv.innerText = "Lỗi kết nối mạng khi tra cứu!";
                statusDiv.className = "error";
                setTimeout(() => { resetScanner(); }, 2000);
            });
        }

        // 2. KHI BẤM XÁC NHẬN NHẬP KHO
        function submitUpdate() {
            let amount = document.getElementById('input-amount').value;
            if (!amount || amount <= 0) {
                alert("Số lượng phải lớn hơn 0");
                return;
            }

            statusDiv.innerText = `Đang cập nhật kho...`;
            statusDiv.className = "loading";
            inputForm.style.display = "none"; // Ẩn form đi cho gọn

            // Gọi API cập nhật (action: 'update')
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'update', maSP: currentScannedCode, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    statusDiv.innerText = data.message;
                    statusDiv.className = "success";
                } else {
                    statusDiv.innerText = `Lỗi cập nhật: ${data.message}`;
                    statusDiv.className = "error";
                }
                setTimeout(() => { resetScanner(); }, 2500);
            })
            .catch(err => {
                statusDiv.innerText = "Lỗi mạng khi cập nhật!";
                statusDiv.className = "error";
                setTimeout(() => { resetScanner(); }, 2500);
            });
        }

        // 3. KHI BẤM HỦY BỎ
        function cancelInput() {
            resetScanner();
        }

        // Hàm đưa giao diện về trạng thái quét ban đầu
        function resetScanner() {
            inputForm.style.display = "none";
            scannerSection.style.display = "block";
            statusDiv.innerText = "Sẵn sàng quét mã tiếp theo...";
            statusDiv.className = "loading";
            isProcessing = false; // Mở khóa cho quét tiếp
        }
    </script>
</body>
</html>
