<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Inventory Log</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; text-align: center; background: #f8fafc; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; text-align: left; }
        h2 { text-align: center; color: #0f172a; margin-top: 0;}
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        #input-form { display: none; background: #eff6ff; padding: 15px; border-radius: 8px; border: 1px solid #bfdbfe; }
        
        .sp-info { font-size: 14px; color: #64748b; margin-bottom: 5px; text-align: center; }
        .qty-info { font-size: 16px; font-weight: bold; color: #1e3a8a; margin-bottom: 15px; text-align: center; }
        
        label { font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
        input:disabled { background-color: #e2e8f0; color: #64748b; }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-submit { background: #2563eb; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }

        #status { padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; text-align: center;}
        .success { background-color: #dcfce7; color: #166534; }
        .error { background-color: #fee2e2; color: #991b1b; }
        .loading { background-color: #f1f5f9; color: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nhập/Xuất Kho</h2>
        
        <div id="scanner-section">
            <div id="reader"></div>
        </div>

        <div id="input-form">
            <div class="sp-info" id="display-maSP">Mã: </div>
            
            <label>Tên Sản Phẩm (prod_name)</label>
            <input type="text" id="prod-name" placeholder="Gõ tên SP nếu quét lần đầu...">
            
            <div class="qty-info" id="sp-qty">Tồn hiện tại: 0</div>
            
            <div class="flex-row">
                <div>
                    <label>Loại Giao Dịch</label>
                    <select id="trans-type" onchange="toggleFormLogic()">
                        <option value="Nhập" selected>Nhập kho</option>
                        <option value="Xuất">Xuất kho</option>
                    </select>
                </div>
                <div>
                    <label>Số lượng (base_qty)</label>
                    <input type="number" id="input-amount" value="1" min="1">
                </div>
            </div>

            <div class="flex-row">
                <div>
                    <label>Ngày GD (trans_date)</label>
                    <input type="date" id="trans-date">
                </div>
                <div>
                    <label>Ngày Nhập Liệu (entry_date)</label>
                    <input type="date" id="entry-date">
                </div>
            </div>

            <label>Đối Tượng (obj_name)</label>
            <input type="text" id="obj-name" placeholder="Ví dụ: Công ty ABC, Nhà PP XYZ...">

            <div class="btn-group">
                <button class="btn-cancel" onclick="cancelInput()">Hủy bỏ</button>
                <button class="btn-submit" onclick="submitUpdate()">Lưu Giao Dịch</button>
            </div>
        </div>

        <div id="status" class="loading">Đang khởi động camera...</div>
    </div>

    <script>
        // DÁN LẠI LINK API CỦA BẠN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbxZi7yFbogjlAfeRKAUkVXKnkYYli0MmByKCpVSNwuK-9_CWLHBijH8fF5trnmIX1yW0A/exec"; 
        
        const statusDiv = document.getElementById('status');
        const inputForm = document.getElementById('input-form');
        const scannerSection = document.getElementById('scanner-section');
        
        const html5QrCode = new Html5Qrcode("reader");
        let isProcessing = false;
        let currentScannedCode = "";

        // Set ngày mặc định là hôm nay
        function getToday() { return new Date().toISOString().split('T')[0]; }

        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess)
            .then(() => { statusDiv.innerText = "Sẵn sàng: Đưa mã vào khung hình"; })
            .catch((err) => { statusDiv.innerText = "Lỗi Camera."; statusDiv.className = "error"; });

        function toggleFormLogic() {
            let type = document.getElementById('trans-type').value;
            let objInput = document.getElementById('obj-name');
            if (type === "Xuất") {
                objInput.value = "Khách lẻ";
                objInput.disabled = true; // Khóa mỏ, không cho sửa
            } else {
                objInput.value = "";
                objInput.disabled = false;
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            currentScannedCode = decodedText;
            
            statusDiv.innerText = `Đang tra cứu kho: ${decodedText}...`;
            statusDiv.className = "loading";

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_info', maSP: decodedText })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    scannerSection.style.display = "none";
                    inputForm.style.display = "block";
                    
                    document.getElementById('display-maSP').innerText = `Mã SP: ${decodedText}`;
                    document.getElementById('sp-qty').innerText = `Tồn hiện tại: ${data.currentQty}`;
                    
                    // Nếu là mã cũ thì điền sẵn tên, mã mới thì để trống cho user gõ
                    document.getElementById('prod-name').value = data.tenSP;
                    
                    // Reset các ô nhập liệu
                    document.getElementById('input-amount').value = 1;
                    document.getElementById('trans-date').value = getToday();
                    document.getElementById('entry-date').value = getToday();
                    document.getElementById('trans-type').value = "Nhập"; 
                    toggleFormLogic(); 

                    statusDiv.innerText = data.isNew ? "Mã mới! Vui lòng nhập Tên sản phẩm." : "Nhập chi tiết giao dịch.";
                    statusDiv.className = "success";
                }
            })
            .catch(err => {
                statusDiv.innerText = "Lỗi mạng!";
                statusDiv.className = "error";
                setTimeout(() => { resetScanner(); }, 2500);
            });
        }

        function submitUpdate() {
            let prodName = document.getElementById('prod-name').value;
            let amount = document.getElementById('input-amount').value;
            let transType = document.getElementById('trans-type').value;
            let objName = document.getElementById('obj-name').value;
            let transDate = document.getElementById('trans-date').value;
            let entryDate = document.getElementById('entry-date').value;

            if (!prodName.trim()) { alert("Vui lòng nhập Tên sản phẩm"); return; }
            if (!amount || amount <= 0) { alert("Số lượng không hợp lệ"); return; }
            if (transType === "Nhập" && !objName.trim()) { alert("Vui lòng nhập Nhà cung cấp"); return; }

            statusDiv.innerText = `Đang ghi Log...`;
            statusDiv.className = "loading";
            inputForm.style.display = "none";

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'update', 
                    maSP: currentScannedCode, 
                    prod_name: prodName,
                    amount: amount,
                    trans_type: transType,
                    trans_date: transDate,
                    entry_date: entryDate,
                    obj_name: objName
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    statusDiv.innerText = data.message;
                    statusDiv.className = "success";
                } else {
                    statusDiv.innerText = `Lỗi: ${data.message}`;
                    statusDiv.className = "error";
                }
                setTimeout(() => { resetScanner(); }, 2500);
            })
            .catch(err => {
                statusDiv.innerText = "Lỗi kết nối máy chủ!";
                statusDiv.className = "error";
                setTimeout(() => { resetScanner(); }, 2500);
            });
        }

        function cancelInput() { resetScanner(); }

        function resetScanner() {
            inputForm.style.display = "none";
            scannerSection.style.display = "block";
            statusDiv.innerText = "Sẵn sàng quét mã tiếp theo...";
            statusDiv.className = "loading";
            isProcessing = false;
        }
    </script>
</body>
</html>
