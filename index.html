<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Hiện Đại</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* FONT VÀ NỀN TỐI (DARK MODE) */
        * { font-family: Arial, "Segoe UI", sans-serif; box-sizing: border-box; }
        body { 
            background: #111827; /* Màu nền tối xanh thẫm */
            margin: 0; padding: 0; color: #f8fafc; 
        }
        
        .container { 
            max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; 
            background: #0f172a;
        }

        /* THANH ĐIỀU HƯỚNG TRÊN CÙNG (TOP BAR) - TỐI GIẢN */
        .top-bar { 
            position: sticky; top: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; padding: 15px 20px; 
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 60px;
        }
        .top-title { font-size: 20px; font-weight: bold; color: #f8fafc; text-align: center; width: 100%; margin: 0; letter-spacing: 1px;}
        
        .top-btn { position: absolute; padding: 8px 15px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; display: none; z-index: 1001; text-transform: uppercase;}
        .btn-back { left: 15px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444;} 
        .btn-save { right: 15px; background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6;}
        .btn-new-item { right: 15px; background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e;} 
        .btn-reload { left: 50%; transform: translateX(-50%); background: transparent; color: #94a3b8; border: 1px solid #475569; font-size: 14px;} 

        .main-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* MENU CHÍNH */
        .menu-btn { 
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 20px; margin-bottom: 15px; 
            font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; 
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .menu-btn:active { transform: scale(0.98); }
        .menu-btn span { margin-right: 15px; font-size: 24px; } 
        
        .btn-menu-scan { border-left: 4px solid #3b82f6; }
        .btn-menu-manual { border-left: 4px solid #f59e0b; }
        .btn-menu-view { border-left: 4px solid #22c55e; }
        .btn-menu-stock { border-left: 4px solid #a855f7; } 

        #scanner-section, #input-form, #inventory-section { display: none; flex-direction: column; flex-grow: 1;}
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* ĐIỀU KHIỂN DANH SÁCH (NGÀY, TÌM KIẾM, FILTER) */
        .inventory-controls { position: sticky; top: 60px; background: #0f172a; padding: 10px 0; z-index: 999; margin-bottom: 15px;}
        
        .date-filter-box { margin-bottom: 15px; }
        .date-filter-box input { 
            width: 100%; border: 1px solid rgba(59, 130, 246, 0.5); color: #93c5fd; font-weight: bold; 
            text-align: center; font-size: 18px; background: rgba(59, 130, 246, 0.1); padding: 12px; border-radius: 8px;
        }
        
        .category-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; -webkit-overflow-scrolling: touch;}
        .category-scroll::-webkit-scrollbar { display: none; } 
        .cat-chip { 
            padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; font-size: 14px; font-weight: bold; color: #cbd5e1; cursor: pointer; white-space: nowrap;
        }
        .cat-chip.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: #22c55e;}

        .search-box input { 
            width: 100%; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); 
            padding: 12px 15px; font-size: 16px; color: white; border-radius: 8px;
        }
        .search-box input::placeholder { color: #64748b; }
        
        #inventory-list { flex-grow: 1; overflow-y: auto; padding-bottom: 20px; display: grid; gap: 15px;}
        
        /* GIAO DIỆN THẺ SẢN PHẨM MỚI (NEON/GLASS) */
        .inv-item { 
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 0; text-align: left; cursor: pointer; 
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        /* Thẻ có hàng (Chốt) */
        .inv-item.status-locked { border-color: rgba(34, 197, 94, 0.3); }
        .inv-item.status-locked::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #22c55e; }
        
        /* Thẻ chưa chốt (Dự kiến) */
        .inv-item.status-pending { border-color: rgba(245, 158, 11, 0.3); }
        .inv-item.status-pending::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #f59e0b; }

        .inv-card-inner { padding: 15px 20px; }
        .inv-name { font-weight: bold; color: #f8fafc; font-size: 18px; margin-bottom: 12px; line-height: 1.3;}
        
        .inv-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .stat-box { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; text-align: center;}
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block;}
        .stat-value { font-size: 16px; font-weight: bold; color: #e2e8f0; }
        
        .inv-status-bar { 
            padding: 10px 20px; background: rgba(0,0,0,0.4); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-text { font-size: 12px; text-transform: uppercase; letter-spacing: 1px;}
        .status-qty { font-size: 20px; font-weight: bold; }
        
        .status-locked .status-text, .status-locked .status-qty { color: #4ade80; }
        .status-pending .status-text, .status-pending .status-qty { color: #fbbf24; }


        /* FORM NHẬP LIỆU BÊN TRONG */
        .form-group { margin-bottom: 20px; text-align: left;}
        label { font-weight: bold; font-size: 15px; color: #cbd5e1; display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
        input, select { 
            width: 100%; padding: 15px; font-size: 16px; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; background: rgba(0,0,0,0.2); color: white;
        }
        input:focus, select:focus { border-color: #3b82f6; outline: none; background: rgba(0,0,0,0.4);}
        input:disabled { background: rgba(255,255,255,0.02); color: #64748b; }
        
        .qty-info-header { 
            text-align: center; margin-bottom: 25px; padding: 20px; border-radius: 12px;
            background: linear-gradient(145deg, rgba(34, 197, 94, 0.1), rgba(0,0,0,0));
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .qty-info-title { font-size: 18px; color: #f8fafc; margin: 0 0 10px 0; font-weight: bold;}
        .qty-info-numbers { font-size: 15px; color: #94a3b8; }
        .qty-info-numbers strong { font-size: 24px; color: #4ade80; display: block; margin-top: 5px;}

        /* Bảng KYC */
        #new-item-section { padding: 20px; background: rgba(245, 158, 11, 0.05); border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(245, 158, 11, 0.2); }
        #dynamic-attributes-container { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px;}
        .kyc-label { font-size: 14px; color: #93c5fd; margin-bottom: 8px; font-weight: normal; text-transform: none;}
        .kyc-select { margin-bottom: 15px; background: rgba(255,255,255,0.05);}
        .kyc-vendor-box { padding: 15px; background: rgba(34, 197, 94, 0.05); border-radius: 8px; margin-bottom: 15px;}
        
        .btn-confirm-new { width: 100%; padding: 15px; background: #f59e0b; color: #000; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;}

        #status { padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: auto; text-align: center; display: none;}
        .success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; display: block !important;}
        .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; display: block !important;}
        .loading { background: rgba(59, 130, 246, 0.1); color: #93c5fd; display: block !important;}

    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button id="top-btn-back" class="top-btn btn-back" onclick="goBack()">Đóng</button>
            <button id="top-btn-reload" class="top-btn btn-reload" onclick="fetchDataInit()">↻ Tải Lại</button>
            <div id="top-title" class="top-title">WMS MASTER</div>
            <button id="top-btn-new" class="top-btn btn-new-item" onclick="openNewItemForm()">Tạo Mã</button>
            <button id="top-btn-save" class="top-btn btn-save" onclick="submitUpdate()">Lưu</button>
        </div>

        <div class="main-content">
            <div id="main-menu">
                <button class="menu-btn btn-menu-scan" onclick="openScanner()"><span>📷</span>Quét Mã Vạch</button>
                <button class="menu-btn btn-menu-manual" onclick="openManual()"><span>✍️</span>Ghi Sổ Thủ Công</button>
                <button class="menu-btn btn-menu-view" onclick="openInventory('VIEW')"><span>📊</span>Báo Cáo Tồn Kho</button>
                <button class="menu-btn btn-menu-stock" onclick="openInventory('STOCK')"><span>📝</span>Kiểm Kê Cuối Ngày</button>
            </div>

            <div id="scanner-section">
                <div id="reader"></div>
            </div>

            <div id="inventory-section">
                <div class="inventory-controls">
                    <div class="date-filter-box">
                        <input type="date" id="list-date-filter" onchange="fetchInventoryForDate()">
                    </div>
                    <div class="category-scroll" id="cat-container"></div>
                    <div class="search-box">
                        <input type="text" id="inv-search" placeholder="🔍 Nhập từ khóa tìm kiếm..." oninput="applyFilters()">
                    </div>
                </div>
                <div id="inventory-list"></div>
            </div>

            <div id="input-form">
                
                <div class="form-group" id="group-search">
                    <label>Tìm & Chọn Hàng Hóa:</label>
                    <input type="text" id="manual-prod" list="prod-datalist" placeholder="Gõ tên..." onchange="onManualSelect()">
                    <datalist id="prod-datalist"></datalist>
                </div>

                <div id="new-item-section" style="display:none;">
                    <p style="color: #fbbf24; font-weight:bold; margin-top:0; text-align:center; font-size:16px;">[ HÀNG MỚI CHƯA CÓ TRONG KHO ]</p>
                    
                    <div class="form-group">
                        <label>Nhóm Hàng:</label>
                        <select id="prod-category" onchange="handleCategoryChange(this)"></select>
                    </div>
                    <div id="dynamic-attributes-container"></div>
                    <div id="kyc-vendor-box" class="kyc-vendor-box">
                        <label class="kyc-label">- Nhà Cung Cấp:</label>
                        <select id="kyc-vendor" class="kyc-select" onchange="handleDropdownAddNew(this)"></select>
                    </div>

                    <div class="form-group">
                        <label>Tên Sản Phẩm (Hệ thống tự tạo):</label>
                        <input type="text" id="prod-name" placeholder="..." style="color: #4ade80;">
                    </div>
                    <button type="button" class="btn-confirm-new" onclick="confirmNewItemInfo()">Xác Nhận Tạo Mã</button>
                </div>
                
                <div id="transaction-details" style="display:none;">
                    
                    <div class="qty-info-header" id="sp-qty-container">
                        </div>

                    <div class="form-group">
                        <label>Loại Giao Dịch:</label>
                        <select id="trans-type" onchange="toggleFormLogic()">
                            <option value="COUNT" selected>Kiểm Kê (Chốt Tồn)</option>
                            <option value="IN">Nhập Kho (Cộng Thêm)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="label-amount" style="color: #fbbf24;">Số Lượng Đếm Được:</label>
                        <input type="number" id="input-amount" pattern="\d*" placeholder="0" style="font-size: 32px; font-weight: bold; text-align: center; color: #fbbf24;">
                    </div>

                    <div class="form-group" id="group-obj" style="display:none;">
                        <label>Đối Tượng / Nhà Cung Cấp:</label>
                        <select id="obj-select" onchange="handleDropdownAddNew(this)"></select>
                    </div>

                    <div class="form-group">
                        <label>Ngày Ghi Sổ:</label>
                        <input type="date" id="trans-date">
                    </div>
                </div>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <script>
        // DÁN LINK API CỦA BÁC VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbxZi7yFbogjlAfeRKAUkVXKnkYYli0MmByKCpVSNwuK-9_CWLHBijH8fF5trnmIX1yW0A/exec";
        
        let dynamicKycConfig = {}; 

        const mainMenu = document.getElementById('main-menu');
        const scannerSection = document.getElementById('scanner-section');
        const inventorySection = document.getElementById('inventory-section');
        const inputForm = document.getElementById('input-form');
        const statusDiv = document.getElementById('status');
        
        const topTitle = document.getElementById('top-title');
        const btnHeadBack = document.getElementById('top-btn-back');
        const btnHeadReload = document.getElementById('top-btn-reload');
        const btnHeadSave = document.getElementById('top-btn-save');
        const btnHeadNew = document.getElementById('top-btn-new');

        const transTypeSelect = document.getElementById('trans-type');
        const objSelect = document.getElementById('obj-select');
        const labelAmount = document.getElementById('label-amount');
        const manualProdInput = document.getElementById('manual-prod');
        const newItemSection = document.getElementById('new-item-section');
        const transDetails = document.getElementById('transaction-details');
        const dateInput = document.getElementById('trans-date');
        const listDateFilter = document.getElementById('list-date-filter');
        
        let html5QrCode, isProcessing = false, currentScannedCode = ""; 
        let formMode = "SCAN", currentFormState = "SELECT_PROD", currentListMode = "VIEW"; 
        let currentScreen = "MENU", previousScreen = "MENU"; 
        
        let cachedVendors = [], cachedProducts = [], globalInventory = [], currentFilterCat = "TẤT CẢ";
        let currentExpectedQty = 0; 

        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            dateInput.value = today; 
            listDateFilter.value = today;
            fetchDataInit();
        };

        function fetchDataInit() {
            showStatus("Đang tải dữ liệu...", "loading");
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'init' }) })
            .then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    cachedVendors = data.vendors; cachedProducts = data.products;
                    dynamicKycConfig = data.kycConfig || {}; 

                    let dl = document.getElementById('prod-datalist'); dl.innerHTML = "";
                    cachedProducts.forEach(p => {
                        let opt = document.createElement('option'); opt.value = `${p.maSP} - ${p.tenSP}`; dl.appendChild(opt);
                    });

                    populateDynamicCategories(); populateKYCVendor(); 
                    
                    if (currentScreen === "LIST") {
                        fetchInventoryForDate();
                    } else {
                        statusDiv.style.display = "none";
                    }
                }
            }).catch(e => showStatus("Mạng yếu, mở lại giùm con.", "error"));
        }

        function populateDynamicCategories() {
            let catSelect = document.getElementById('prod-category');
            let scrollContainer = document.getElementById('cat-container');
            catSelect.innerHTML = "";
            scrollContainer.innerHTML = `<button class="cat-chip active" onclick="filterCategory('TẤT CẢ', this)">TẤT CẢ</button>`;

            let categories = Object.keys(dynamicKycConfig);
            categories.forEach(cat => {
                let opt = document.createElement('option'); opt.value = cat; opt.text = cat; catSelect.appendChild(opt);
                scrollContainer.innerHTML += `<button class="cat-chip" onclick="filterCategory('${cat}', this)">${cat}</button>`;
            });
            let optKhac = document.createElement('option'); optKhac.value = "KHÁC"; optKhac.text = "KHÁC"; catSelect.appendChild(optKhac);
            let optAddNew = document.createElement('option'); optAddNew.value = "ADD_NEW"; optAddNew.text = "+ Thêm nhóm mới"; catSelect.appendChild(optAddNew);
        }

        function populateKYCVendor() {
            let vSelect = document.getElementById('kyc-vendor');
            vSelect.innerHTML = '<option value="">-- Bỏ qua --</option>';
            cachedVendors.forEach(v => { let opt = document.createElement('option'); opt.value = v; opt.text = v; vSelect.appendChild(opt); });
            let optNew = document.createElement('option'); optNew.value = "ADD_NEW"; optNew.text = "+ Thêm NCC mới"; vSelect.appendChild(optNew);
        }

        function getToday() { return new Date().toISOString().split('T')[0]; }
        function showStatus(msg, type) { statusDiv.innerHTML = msg; statusDiv.className = type; statusDiv.style.display="block";}

        function updateHeader(viewName) {
            btnHeadBack.style.display = "none"; btnHeadReload.style.display = "none"; 
            btnHeadSave.style.display = "none"; btnHeadNew.style.display = "none"; topTitle.innerText = "";

            if(viewName === 'MENU') {
                topTitle.innerText = "WMS MASTER"; 
                btnHeadReload.style.display = "block"; 
            } else if(viewName === 'LIST') {
                btnHeadBack.style.display = "block"; btnHeadNew.style.display = "block"; 
            } else if(viewName === 'SCAN') {
                topTitle.innerText = "QUÉT MÃ"; btnHeadBack.style.display = "block"; 
            } else if(viewName === 'FORM') {
                topTitle.innerText = "GHI SỔ"; btnHeadBack.style.display = "block";
                if(currentFormState === "TRANS_INFO") btnHeadSave.style.display = "block"; 
            }
        }

        function goBack() {
            if (currentScreen === "FORM" && previousScreen === "LIST") {
                inputForm.style.display = "none"; inventorySection.style.display = "block"; statusDiv.style.display = "none";
                currentScreen = "LIST"; updateHeader('LIST');
            } else {
                if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(e=>e);
                scannerSection.style.display = "none"; inputForm.style.display = "none";
                inventorySection.style.display = "none"; statusDiv.style.display = "none";
                mainMenu.style.display = "block"; isProcessing = false;
                currentScreen = "MENU"; previousScreen = "MENU"; updateHeader('MENU');
            }
        }

        function handleDropdownAddNew(selectElement) {
            if (selectElement.value === "ADD_NEW") {
                let newVal = prompt("Gõ thông tin mới:");
                if (newVal && newVal.trim() !== "") {
                    let opt = document.createElement('option'); opt.value = newVal.trim(); opt.text = newVal.trim();
                    selectElement.insertBefore(opt, selectElement.lastElementChild); selectElement.value = newVal.trim();
                } else {
                    selectElement.value = ""; if(selectElement.id === "obj-select") selectElement.value = "Nhà cung cấp lẻ";
                }
            }
            autoGenName(); 
        }

        function handleCategoryChange(sel) {
            if(sel.value === "ADD_NEW") {
                let newVal = prompt("Nhóm hàng mới:");
                if(newVal && newVal.trim() !== "") {
                    let opt = document.createElement('option'); opt.value = newVal.trim().toUpperCase(); opt.text = newVal.trim().toUpperCase();
                    sel.insertBefore(opt, sel.lastElementChild); sel.value = opt.value;
                } else { sel.value = "KHÁC"; }
            }
            renderKYCFields();
        }

        function toggleFormLogic() {
            let type = transTypeSelect.value;
            objSelect.innerHTML = ""; 
            if(type === "IN") {
                labelAmount.innerText = "SỐ LƯỢNG NHẬP VÀO:"; labelAmount.style.color = "#3b82f6"; document.getElementById('input-amount').style.color = "#3b82f6";
                document.getElementById('group-obj').style.display = "block";
                let opt = document.createElement('option'); opt.value = "Nhà cung cấp lẻ"; opt.text = "Nhà cung cấp lẻ"; objSelect.appendChild(opt);
                cachedVendors.forEach(name => { let o = document.createElement('option'); o.value = name; o.text = name; objSelect.appendChild(o); });
                let optNew = document.createElement('option'); optNew.value = "ADD_NEW"; optNew.text = "+ Thêm NCC mới..."; objSelect.appendChild(optNew);
            } else { 
                labelAmount.innerText = "SỐ LƯỢNG ĐẾM TRÊN KỆ:"; labelAmount.style.color = "#f59e0b"; document.getElementById('input-amount').style.color = "#f59e0b";
                document.getElementById('group-obj').style.display = "none"; 
            }
        }

        function renderKYCFields() {
            let cat = document.getElementById('prod-category').value;
            let container = document.getElementById('dynamic-attributes-container');
            let fields = dynamicKycConfig[cat];
            document.getElementById('kyc-vendor-box').style.display = "block";

            if(fields && fields.length > 0) {
                container.style.display = "block";
                let html = "";
                fields.forEach(f => {
                    html += `<div style="margin-bottom:12px;"><label class="kyc-label">- ${f.label}</label><select class="kyc-select kyc-field-dynamic" onchange="handleDropdownAddNew(this)">`;
                    f.opts.forEach(opt => { html += `<option value="${opt}">${opt === "" ? "-- Chọn --" : opt}</option>`; });
                    html += `<option value="ADD_NEW">+ Thêm mới...</option></select></div>`;
                });
                container.innerHTML = html;
            } else { container.style.display = "none"; container.innerHTML = ""; }
            autoGenName(); 
        }

        function autoGenName() {
            let container = document.getElementById('dynamic-attributes-container');
            let baseName = "";
            if (container.style.display !== "none") {
                let selects = document.querySelectorAll('.kyc-field-dynamic');
                let nameParts = [];
                selects.forEach(s => { if(s.value !== "" && s.value !== "ADD_NEW") nameParts.push(s.value); });
                baseName = nameParts.join(" ");
            } else {
                let currentName = document.getElementById('prod-name').value;
                baseName = currentName.includes(" - ") ? currentName.split(" - ")[0] : currentName;
            }
            
            let vendor = document.getElementById('kyc-vendor').value;
            let finalName = baseName.trim();
            if (finalName !== "" && vendor !== "" && vendor !== "ADD_NEW") finalName = finalName + " - " + vendor;
            if (finalName !== "") document.getElementById('prod-name').value = finalName;
        }

        // HÀM RENDER INFO TRONG FORM ĐƯỢC CHỈNH THEO DARK MODE
        function renderDetailQuantityBox(tenSP, opening, inputs, ending) {
            currentExpectedQty = opening + inputs;
            let expected = currentExpectedQty;
            let statusText = ending !== "" ? `ĐÃ CHỐT: ${ending}` : `DỰ KIẾN: ${expected}`;
            let statusColor = ending !== "" ? "#4ade80" : "#fbbf24";
            
            document.getElementById('sp-qty-container').innerHTML = `
                <p class="qty-info-title">${tenSP}</p>
                <div class="qty-info-numbers">
                    Tồn Đầu: ${opening} &nbsp;|&nbsp; Nhập: ${inputs}
                    <strong style="color: ${statusColor}">${statusText}</strong>
                </div>
            `;
        }

        function openNewItemForm() {
            formMode = "MANUAL"; currentScannedCode = ""; currentScreen = "FORM"; previousScreen = "LIST"; 
            inventorySection.style.display = "none"; inputForm.style.display = "block"; 
            document.getElementById('group-search').style.display = "none"; 
            
            document.getElementById('sp-qty-container').innerHTML = `<p class="qty-info-title">HÀNG MỚI CHƯA GHI SỔ</p>`;
            currentFormState = "NEW_INFO"; updateHeader('FORM');
            currentExpectedQty = 0; 
            
            newItemSection.style.display = "block"; transDetails.style.display = "none";
            let catSelect = document.getElementById('prod-category');
            if(catSelect.options.length > 0) catSelect.selectedIndex = 0;
            document.getElementById('prod-name').disabled = false; document.getElementById('kyc-vendor').value = ""; 
            
            dateInput.value = listDateFilter.value;
            renderKYCFields(); 
            transTypeSelect.value = (currentListMode === "STOCK") ? "COUNT" : "IN"; toggleFormLogic(); 
        }

        function openScanner() {
            formMode = "SCAN"; currentScreen = "SCAN"; previousScreen = "MENU";
            mainMenu.style.display = "none"; scannerSection.style.display = "block"; updateHeader('SCAN');
            if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess).catch(e => { showStatus("Lỗi camera.", "error"); setTimeout(goBack, 2000); });
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; isProcessing = true; currentScannedCode = decodedText;
            html5QrCode.stop().then(() => {
                showStatus(`Đang đọc dữ liệu...`, "loading");
                fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_info', maSP: decodedText, trans_date: dateInput.value }) })
                .then(res => res.json()).then(data => {
                    scannerSection.style.display = "none"; inputForm.style.display = "block"; statusDiv.style.display = "none";
                    currentScreen = "FORM"; previousScreen = "MENU"; document.getElementById('group-search').style.display = "none";
                    
                    if(data.isNew) {
                        currentExpectedQty = 0;
                        document.getElementById('sp-qty-container').innerHTML = `<p class="qty-info-title">HÀNG MỚI CHƯA GHI SỔ</p>`;
                        currentFormState = "NEW_INFO"; updateHeader('FORM');
                        newItemSection.style.display = "block"; transDetails.style.display = "none";
                        let catSelect = document.getElementById('prod-category'); if(catSelect.options.length > 0) catSelect.selectedIndex = 0;
                        document.getElementById('prod-name').disabled = false; document.getElementById('kyc-vendor').value = "";
                        renderKYCFields(); 
                    } else {
                        renderDetailQuantityBox(data.tenSP, data.opening, data.inputsToday, data.currentEnding);
                        currentFormState = "TRANS_INFO"; updateHeader('FORM');
                        document.getElementById('prod-name').value = data.tenSP; 
                        newItemSection.style.display = "none"; transDetails.style.display = "block";
                        document.getElementById('input-amount').value = ""; transTypeSelect.value = "COUNT"; toggleFormLogic(); 
                    }
                }).catch(e => { showStatus("Lỗi mạng.", "error"); setTimeout(goBack, 2000); });
            });
        }

        function openManual() {
            formMode = "MANUAL"; currentScannedCode = ""; currentScreen = "FORM"; previousScreen = "MENU";
            mainMenu.style.display = "none"; inputForm.style.display = "block"; 
            currentFormState = "SELECT_PROD"; updateHeader('FORM');
            document.getElementById('group-search').style.display = "block";
            newItemSection.style.display = "none"; transDetails.style.display = "none";
            manualProdInput.value = ""; document.getElementById('sp-qty-container').innerHTML = "";
            statusDiv.style.display = "none";
        }

        function onManualSelect() {
            let val = manualProdInput.value; if(!val.trim()) return;
            let found = cachedProducts.find(p => `${p.maSP} - ${p.tenSP}` === val);
            
            showStatus(`Đang tìm...`, "loading");
            let queryCode = found ? found.maSP : val;
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_info', maSP: queryCode, trans_date: dateInput.value }) })
            .then(res => res.json()).then(data => {
                statusDiv.style.display = "none";
                if(data.isNew) {
                    currentExpectedQty = 0;
                    currentFormState = "NEW_INFO"; updateHeader('FORM');
                    document.getElementById('sp-qty-container').innerHTML = `<p class="qty-info-title">HÀNG MỚI CHƯA GHI SỔ</p>`;
                    newItemSection.style.display = "block"; transDetails.style.display = "none";
                    let catSelect = document.getElementById('prod-category'); if(catSelect.options.length > 0) catSelect.selectedIndex = 0;
                    document.getElementById('prod-name').disabled = false; document.getElementById('kyc-vendor').value = "";
                    renderKYCFields(); document.getElementById('prod-name').value = val; 
                } else {
                    renderDetailQuantityBox(data.tenSP, data.opening, data.inputsToday, data.currentEnding);
                    currentFormState = "TRANS_INFO"; updateHeader('FORM');
                    newItemSection.style.display = "none"; transDetails.style.display = "block";
                    document.getElementById('input-amount').value = ""; transTypeSelect.value = "COUNT"; toggleFormLogic(); 
                }
            });
        }

        function confirmNewItemInfo() {
            if(!document.getElementById('prod-name').value.trim()) { alert("Vui lòng điền tên."); return; }
            currentFormState = "TRANS_INFO"; updateHeader('FORM');
            newItemSection.style.display = "none"; transDetails.style.display = "block";
            document.getElementById('input-amount').value = ""; transTypeSelect.value = (currentListMode === "STOCK") ? "COUNT" : "IN"; toggleFormLogic(); 
        }

        function jumpToManualFromInv(maSP, tenSP, opening, inputsToday, currentEnding, mode) {
            formMode = "MANUAL"; currentScannedCode = ""; currentScreen = "FORM"; previousScreen = "LIST"; 
            inventorySection.style.display = "none"; inputForm.style.display = "block"; 
            currentFormState = "TRANS_INFO"; updateHeader('FORM'); document.getElementById('group-search').style.display = "block";
            newItemSection.style.display = "none"; transDetails.style.display = "block";
            
            manualProdInput.value = `${maSP} - ${tenSP}`; 
            renderDetailQuantityBox(tenSP, opening, inputsToday, currentEnding);
            
            document.getElementById('input-amount').value = ""; 
            dateInput.value = listDateFilter.value;
            transTypeSelect.value = (mode === "STOCK") ? "COUNT" : "IN"; toggleFormLogic(); statusDiv.style.display = "none";
        }

        function submitUpdate() {
            if(currentFormState !== "TRANS_INFO") return;
            
            let amount = Number(document.getElementById('input-amount').value);
            let transType = transTypeSelect.value;
            
            if (transType === "COUNT" && amount > currentExpectedQty) {
                alert(`⚠️ LỖI SỐ LIỆU!\n\nTồn dự kiến: ${currentExpectedQty}\nĐếm thực tế: ${amount}\n\n=> Có hàng nhập chưa ghi sổ. Vui lòng chọn "Nhập Kho" trước!`);
                return;
            }

            if (amount === "" || isNaN(amount)) { alert("Chưa nhập Số lượng!"); return; }

            let prodName = "", maSP = "", category = "KHÁC";

            if (formMode === "SCAN") {
                maSP = currentScannedCode; prodName = document.getElementById('prod-name').value;
                if (!document.getElementById('prod-name').disabled) category = document.getElementById('prod-category').value; 
            } else { 
                if (document.getElementById('group-search').style.display === "none") {
                    maSP = ""; prodName = document.getElementById('prod-name').value; category = document.getElementById('prod-category').value;
                } else {
                    let val = manualProdInput.value;
                    if (val.includes(" - ")) { maSP = val.split(" - ")[0]; prodName = val.split(" - ")[1]; } 
                    else { maSP = ""; prodName = document.getElementById('prod-name').value; category = document.getElementById('prod-category').value; }
                }
            }

            showStatus(`Đang lưu dữ liệu...`, "loading");
            inputForm.style.display = "none"; btnHeadSave.style.display = "none"; 

            fetch(API_URL, {
                method: 'POST', 
                body: JSON.stringify({ 
                    action: 'update', maSP: maSP, prod_name: prodName, category: category, 
                    amount: amount, trans_type: transType, 
                    trans_date: dateInput.value, obj_name: transType === "IN" ? objSelect.value : "" 
                })
            }).then(res => res.json()).then(data => {
                if(data.status === 'success') { showStatus(data.message, "success"); fetchDataInit(); } 
                else { showStatus(`Lỗi: ${data.message}`, "error"); setTimeout(goBack, 3000); }
            }).catch(e => { showStatus("Lỗi kết nối!", "error"); setTimeout(goBack, 3000); });
        }

        function openInventory(mode) {
            currentListMode = mode; currentScreen = "LIST"; previousScreen = "MENU";
            mainMenu.style.display = "none"; inventorySection.style.display = "block"; updateHeader('LIST'); document.getElementById('inv-search').value = ""; 
            document.getElementById('inv-search').placeholder = (mode === "STOCK") ? "🔍 Tìm nhanh để kiểm..." : "🔍 Tìm nhanh...";
            fetchInventoryForDate(); 
        }

        function fetchInventoryForDate() {
            let selectedDate = listDateFilter.value;
            showStatus("Đang tải ngày " + selectedDate + "...", "loading");
            let listDiv = document.getElementById('inventory-list'); listDiv.innerHTML = ""; 

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_inventory', trans_date: selectedDate }) })
            .then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    globalInventory = data.inventory; statusDiv.style.display = "none"; applyFilters(); 
                }
            }).catch(e => showStatus("Lỗi mạng!", "error"));
        }

        function filterCategory(catName, btnElement) {
            currentFilterCat = catName;
            let chips = document.getElementsByClassName('cat-chip');
            for(let i=0; i<chips.length; i++) chips[i].classList.remove('active'); 
            btnElement.classList.add('active'); applyFilters();
        }

        // HÀM RENDER THẺ SẢN PHẨM CHUẨN DESIGN GLASSMORPHISM
        function applyFilters() {
            let searchText = document.getElementById('inv-search').value.toLowerCase();
            let listDiv = document.getElementById('inventory-list'); listDiv.innerHTML = ""; 
            if(globalInventory.length === 0) { listDiv.innerHTML = "<p style='text-align:center; color:#64748b;'>Chưa có dữ liệu</p>"; return; }

            globalInventory.forEach(item => {
                let matchCat = (currentFilterCat === "TẤT CẢ" || item.category === currentFilterCat);
                if (matchCat && item.tenSP.toLowerCase().includes(searchText)) {
                    
                    let expected = item.opening + item.inputsToday;
                    let isLocked = item.currentEnding !== "";
                    
                    // Style Class
                    let statusClass = isLocked ? "status-locked" : "status-pending";
                    let statusText = isLocked ? "Đã Chốt Tồn" : "Chưa Chốt";
                    let displayQty = isLocked ? item.currentEnding : expected;

                    let div = document.createElement('div'); 
                    div.className = `inv-item ${statusClass}`;
                    
                    div.onclick = function() { jumpToManualFromInv(item.maSP, item.tenSP, item.opening, item.inputsToday, item.currentEnding, currentListMode); };
                    
                    div.innerHTML = `
                        <div class="inv-card-inner">
                            <div class="inv-name">${item.tenSP}</div>
                            
                            <div class="inv-stats-grid">
                                <div class="stat-box">
                                    <span class="stat-label">Tồn Đầu Ngày</span>
                                    <span class="stat-value">${item.opening}</span>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">Nhập Thêm</span>
                                    <span class="stat-value">${item.inputsToday}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="inv-status-bar">
                            <span class="status-text">${statusText}</span>
                            <span class="status-qty">${displayQty}</span>
                        </div>
                    `;
                    listDiv.appendChild(div);
                }
            });
        }
    </script>
</body>
</html>
