<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Kho Đơn Giản</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Tùy chỉnh cực to rõ cho người lớn tuổi */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; color: #111; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #003366; font-size: 26px; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
        
        /* Nút menu chính khổng lồ */
        #main-menu { text-align: center; padding: 10px 0; }
        .menu-btn { display: block; width: 100%; padding: 25px; margin-bottom: 20px; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; }
        .btn-scan { background-color: #0056b3; }
        .btn-view { background-color: #008000; }
        .btn-back { background-color: #555; color: white; padding: 18px; width: 100%; border: none; border-radius: 10px; margin-bottom: 20px; font-size: 20px; font-weight: bold; cursor: pointer;}

        /* Khung Camera */
        #scanner-section, #input-form, #inventory-section { display: none; }
        #reader { width: 100%; border-radius: 10px; border: 3px solid #0056b3; overflow: hidden; margin-bottom: 20px; }
        
        /* Hiển thị thông tin sản phẩm to rõ */
        .sp-info { font-size: 20px; color: #333; margin-bottom: 10px; text-align: center; }
        .qty-info { font-size: 26px; font-weight: bold; color: #d10000; margin-bottom: 25px; text-align: center; background: #ffe6e6; padding: 10px; border-radius: 10px;}
        
        /* Ô nhập liệu to, dễ bấm */
        .form-group { margin-bottom: 25px; text-align: left;}
        label { font-weight: bold; font-size: 18px; color: #111; display: block; margin-bottom: 10px; }
        input, select { width: 100%; padding: 18px; font-size: 20px; border: 2px solid #ccc; border-radius: 10px; box-sizing: border-box; background-color: #fff;}
        input:focus, select:focus { border-color: #0056b3; outline: none; background-color: #f0f8ff;}
        input:disabled { background-color: #e0e0e0; color: #555; }
        
        /* Nút Lưu / Hủy */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn-group button { padding: 20px; font-size: 22px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; flex: 1; }
        .btn-submit { background-color: #0056b3; color: white; }
        .btn-cancel { background-color: #cc0000; color: white; }

        /* Khung thông báo */
        #status { padding: 20px; border-radius: 10px; font-weight: bold; font-size: 20px; margin-top: 20px; text-align: center; display: none;}
        .success { background-color: #ccffcc; color: #006600; display: block !important;}
        .error { background-color: #ffcccc; color: #cc0000; display: block !important;}
        .loading { background-color: #e6f2ff; color: #003366; display: block !important;}

        /* Bảng Tồn Kho */
        .inv-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 2px solid #ddd; }
        .inv-name { font-weight: bold; color: #111; font-size: 22px; margin-bottom: 5px;}
        .inv-code { font-size: 16px; color: #666; }
        .inv-qty { font-weight: bold; color: #008000; font-size: 26px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📦 QUẢN LÝ KHO</h2>
        
        <div id="main-menu">
            <button class="menu-btn btn-scan" onclick="openScanner()">📷 QUÉT MÃ VẠCH</button>
            <button class="menu-btn btn-view" onclick="openInventory()">📊 XEM TỒN KHO</button>
        </div>

        <div id="scanner-section">
            <button class="btn-back" onclick="goBackToMenu()">⬅ QUAY LẠI MÀN HÌNH CHÍNH</button>
            <div id="reader"></div>
        </div>

        <div id="inventory-section">
            <button class="btn-back" onclick="goBackToMenu()">⬅ QUAY LẠI MÀN HÌNH CHÍNH</button>
            <div id="inventory-list"></div>
        </div>

        <div id="input-form">
            <div class="sp-info" id="display-maSP">Mã hàng: </div>
            <div class="qty-info" id="sp-qty">Tồn kho đang có: 0</div>
            
            <div class="form-group">
                <label>Tên Sản Phẩm:</label>
                <input type="text" id="prod-name" placeholder="Nhập tên nếu là hàng mới...">
            </div>
            
            <div class="form-group">
                <label>Loại Giao Dịch:</label>
                <select id="trans-type" onchange="toggleObjList()">
                    <option value="IN" selected>NHẬP HÀNG VÀO KHO</option>
                    <option value="OUT">XUẤT HÀNG BÁN ĐI</option>
                </select>
            </div>

            <div class="form-group">
                <label>Số Lượng Cần Nhập/Xuất:</label>
                <input type="number" id="input-amount" value="1" min="1">
            </div>

            <div class="form-group">
                <label id="label-doi-tuong">Nhà Cung Cấp:</label>
                <select id="obj-select"></select>
            </div>

            <div class="form-group">
                <label>Ngày Giao Dịch:</label>
                <input type="date" id="trans-date">
            </div>

            <div class="btn-group">
                <button class="btn-cancel" onclick="goBackToMenu()">HỦY BỎ</button>
                <button class="btn-submit" onclick="submitUpdate()">LƯU LẠI</button>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // THAY LINK APP SCRIPT VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbxZi7yFbogjlAfeRKAUkVXKnkYYli0MmByKCpVSNwuK-9_CWLHBijH8fF5trnmIX1yW0A/exec"; 
        
        const mainMenu = document.getElementById('main-menu');
        const scannerSection = document.getElementById('scanner-section');
        const inventorySection = document.getElementById('inventory-section');
        const inputForm = document.getElementById('input-form');
        const statusDiv = document.getElementById('status');
        const transTypeSelect = document.getElementById('trans-type');
        const objSelect = document.getElementById('obj-select');
        const labelDoiTuong = document.getElementById('label-doi-tuong');
        
        let html5QrCode;
        let isProcessing = false;
        let currentScannedCode = "";
        
        let cachedCustomers = [];
        let cachedVendors = [];

        // HÀM TẢI NGẦM DỮ LIỆU KHI VỪA MỞ APP
        window.onload = function() {
            showStatus("Đang nạp dữ liệu hệ thống...", "loading");
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'init' })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    cachedCustomers = data.customers;
                    cachedVendors = data.vendors;
                    statusDiv.style.display = "none"; // Ẩn thông báo đi
                }
            })
            .catch(err => {
                showStatus("Mạng yếu, chưa tải được danh sách khách hàng.", "error");
            });
        };

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function showStatus(msg, type) {
            statusDiv.innerText = msg;
            statusDiv.className = type;
        }

        function goBackToMenu() {
            if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().catch(err => console.log(err)); }
            scannerSection.style.display = "none";
            inputForm.style.display = "none";
            inventorySection.style.display = "none";
            statusDiv.style.display = "none";
            mainMenu.style.display = "block";
            isProcessing = false;
        }

        function openScanner() {
            mainMenu.style.display = "none";
            scannerSection.style.display = "block";
            statusDiv.style.display = "block";
            showStatus("Đang mở Camera...", "loading");

            if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess)
                .then(() => { showStatus("Hãy đưa mã vạch vào ô vuông phía trên", "success"); })
                .catch((err) => { showStatus("Lỗi: Máy bạn chưa cho phép dùng Camera.", "error"); });
        }

        function toggleObjList() {
            let type = transTypeSelect.value;
            objSelect.innerHTML = ""; 
            
            if(type === "IN") {
                labelDoiTuong.innerText = "Nhà Cung Cấp:";
                let opt = document.createElement('option');
                opt.value = "Nhà cung cấp lẻ"; opt.text = "Nhà cung cấp lẻ";
                objSelect.appendChild(opt);
                cachedVendors.forEach(name => {
                    let o = document.createElement('option'); o.value = name; o.text = name; objSelect.appendChild(o);
                });
            } else {
                labelDoiTuong.innerText = "Khách Hàng Mua:";
                let opt = document.createElement('option');
                opt.value = "Khách mua lẻ"; opt.text = "Khách mua lẻ";
                objSelect.appendChild(opt);
                cachedCustomers.forEach(name => {
                    let o = document.createElement('option'); o.value = name; o.text = name; objSelect.appendChild(o);
                });
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            currentScannedCode = decodedText;
            
            html5QrCode.stop().then(() => {
                showStatus(`Đang kiểm tra mã: ${decodedText}...`, "loading");

                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get_info', maSP: decodedText })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        scannerSection.style.display = "none";
                        inputForm.style.display = "block";
                        
                        document.getElementById('display-maSP').innerText = `Mã hàng: ${decodedText}`;
                        document.getElementById('sp-qty').innerText = `Tồn kho đang có: ${data.currentQty}`;
                        
                        let prodInput = document.getElementById('prod-name');
                        prodInput.value = data.tenSP;
                        prodInput.disabled = !data.isNew; 
                        
                        document.getElementById('input-amount').value = 1;
                        document.getElementById('trans-date').value = getToday();
                        transTypeSelect.value = "IN"; 
                        toggleObjList(); 

                        showStatus(data.isNew ? "Hàng mới! Hãy gõ tên Sản phẩm vào." : "Hãy điền số lượng cần Nhập/Xuất.", "success");
                    }
                })
                .catch(err => {
                    showStatus("Lỗi mạng! Không kiểm tra được.", "error");
                    setTimeout(() => { goBackToMenu(); }, 2000);
                });
            });
        }

        function submitUpdate() {
            let prodName = document.getElementById('prod-name').value;
            let amount = document.getElementById('input-amount').value;
            let transType = transTypeSelect.value;
            let objName = objSelect.value;
            let transDate = document.getElementById('trans-date').value;
            let entryDate = getToday(); // Lấy ngày hiện tại làm ngày ghi sổ tự động luôn

            if (!prodName.trim()) { alert("Chưa nhập Tên sản phẩm!"); return; }
            if (!amount || amount <= 0) { alert("Số lượng phải lớn hơn 0!"); return; }

            showStatus(`Đang lưu vào sổ sách...`, "loading");
            inputForm.style.display = "none";

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'update', maSP: currentScannedCode, prod_name: prodName,
                    amount: amount, trans_type: transType, trans_date: transDate,
                    entry_date: entryDate, obj_name: objName
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    showStatus(data.message, "success");
                } else {
                    showStatus(`Lỗi: ${data.message}`, "error");
                }
                // Dừng 3 giây cho các cô chú đọc thông báo thành công
                setTimeout(() => { goBackToMenu(); }, 3000); 
            })
            .catch(err => {
                showStatus("Lỗi kết nối máy chủ!", "error");
                setTimeout(() => { goBackToMenu(); }, 3000);
            });
        }

        function openInventory() {
            mainMenu.style.display = "none";
            inventorySection.style.display = "block";
            statusDiv.style.display = "block";
            showStatus("Đang tải danh sách tồn kho...", "loading");
            
            let listDiv = document.getElementById('inventory-list');
            listDiv.innerHTML = ""; 

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_inventory' })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    statusDiv.style.display = "none"; 
                    if(data.inventory.length === 0) {
                        listDiv.innerHTML = "<p style='text-align:center; font-size:20px; color:#666;'>Kho chưa có hàng nào</p>";
                        return;
                    }
                    
                    data.inventory.forEach(item => {
                        let div = document.createElement('div');
                        div.className = "inv-item";
                        div.innerHTML = `
                            <div>
                                <div class="inv-name">${item.tenSP}</div>
                                <div class="inv-code">Mã: ${item.maSP}</div>
                            </div>
                            <div class="inv-qty">${item.ending}</div>
                        `;
                        listDiv.appendChild(div);
                    });
                } else {
                    showStatus("Bị lỗi khi tải tồn kho!", "error");
                }
            })
            .catch(err => {
                showStatus("Lỗi mạng! Không xem được.", "error");
            });
        }
    </script>
</body>
</html>
